# task5 nosym VQE 网格与优化配置（vqe-nosym-inits）

L = 8
boundary = "OBC"
depths = [1, 5]
inits = "nosym"  # triv 对称复用；topo 去 (0,7) link；AFM 取单支（见 doc/qc/initial_state.md）

[grid]
s_min = 0.0
s_max = 1.0
ns_default = 51
deltas = [-1.0, 1.0]

# 行序：delta 外层、s 内层（与 task3/4 契约同序）
[paths]
# {depth} 占位：如 task5_vqe_nosym/depth1/data/interim/vqe_L8_OBC.csv
vqe_csv = "task5_vqe_nosym/depth{depth}/data/interim/vqe_L8_OBC.csv"
thetas = "task5_vqe_nosym/depth{depth}/data/interim/vqe_thetas.json"
# 对照输入（task1 解析谱）
spectra_csv = "task1_baseline/data/interim/spectra_L8_OBC.csv"

[optimize]
# depth1：task3 同形两步优化（DE 全局 + COBYLA polish）
global_method = "differential_evolution"
local_method = "COBYLA"
# depth5：本任务 depth1 直跳 warm-start（16 参数微扰，pilot 锁定 0.4，见 config/pilot.md）
perturb_scale = 0.4
cobyla_maxiter = 500
n_restarts = 3  # 逐点取最优
workers = 8
# 确定性要求单线程 BLAS（同 task3/4）
seed_base = 20260923
