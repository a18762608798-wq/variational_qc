# CondaPkg env for variational_qc v0.2.0 (SSH-XXZ 01-04).
# Style mirrors 03_tools_practice/qmeas/CondaPkg.toml.
# qmeas itself is reused via editable pip install (Constitution II.5 thin adapter).

[deps]
numpy = ""
scipy = ""
qiskit = ""
matplotlib = ""
pytest = ""

[deps.qiskit-aer]
channel = "conda-forge"

[pip.deps]
qiskit-aer = ""
quarkstudio = ""
quarkcircuit = ""
matplotlib = ""

[pip.deps.qmeas]
editable = true
version = "@ ../../../03_tools_practice/qmeas"
